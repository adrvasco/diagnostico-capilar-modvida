<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IA Modvida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Fraunces:opsz,wght@9..144,480;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<style>
  :root{
    --bg: #EDF3FA;
    --bg-soft: #E2ECF7;
    --panel-solid: #FFFFFF;
    --ink: #12253C;
    --blue: #2F63C7;
    --blue-bright: #3E7FEA;
    --blue-deep: #163B76;
    --teal: #2FA0A8;
    --mist: #55677E;
    --mist-dim: #8194AA;
    --line: rgba(18,50,90,0.14);
    --line-soft: rgba(18,50,90,0.08);
  }

  *{ box-sizing: border-box; }
  ::selection{ background: var(--blue); color: white; }

  html, body{
    height: 100%;
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  /* ---------- App shell: tela cheia, mobile-first ---------- */
  .app{
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin: 0 auto;
    background: var(--panel-solid);
    position: relative;
  }

  /* ---------- Header fixo, minimalista ---------- */
  header.chat-head{
    flex-shrink: 0;
    display:flex;
    align-items:center;
    gap: 12px;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px;
    background: var(--panel-solid);
    border-bottom: 1px solid var(--line-soft);
    box-shadow: 0 2px 10px rgba(18,50,90,0.03);
    z-index: 2;
  }

  .chat-avatar{
    width: 38px; height:38px;
    border-radius: 12px;
    background: #FFFFFF;
    border: 1px solid var(--line-soft);
    display:flex; align-items:center; justify-content:center;
    flex-shrink: 0;
    padding: 5px;
  }
  .chat-avatar img{
    width: 100%; height: 100%;
    object-fit: contain;
  }

  .chat-head-text{ flex: 1; min-width: 0; }
  .chat-head-text .name{
    font-family:'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: .2px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .chat-head-text .name .robot-icon{
    width: 20px; height: 20px;
    flex-shrink: 0;
    color: var(--blue);
  }
  .chat-head-text .status{
    font-size: 12px; color: var(--mist-dim);
    display:flex; align-items:center; gap:6px;
    margin-top: 2px;
  }
  .chat-head-text .status::before{
    content:''; width:6px; height:6px; border-radius:50%;
    background:#5FBE85; display:inline-block;
    box-shadow: 0 0 0 3px rgba(95,190,133,0.18);
  }
  .chat-head-text .status.offline::before{
    background:#D3665F;
    box-shadow: 0 0 0 3px rgba(211,102,95,0.18);
  }

  .reset-btn{
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--mist);
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    font-size: 16px;
  }
  .reset-btn:hover{ border-color: var(--blue-bright); color: var(--blue-bright); }

  /* ---------- Área de mensagens: ocupa o resto da tela ---------- */
  .chat-body{
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display:flex;
    flex-direction: column;
    gap: 12px;
    background:
      radial-gradient(circle at 15% 0%, rgba(62,127,234,0.06), transparent 45%),
      radial-gradient(circle at 100% 30%, rgba(47,160,168,0.05), transparent 40%),
      var(--bg);
  }

  .chat-body::-webkit-scrollbar{ width: 5px; }
  .chat-body::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 10px; }

  .msg{
    max-width: 86%;
    padding: 12px 15px;
    border-radius: 18px 18px 18px 4px;
    font-size: 14.5px;
    box-shadow: 0 2px 8px rgba(18,50,90,0.05);
  }

  .msg.bot{
    background: var(--panel-solid);
    align-self: flex-start;
    color: var(--ink);
  }

  .msg.user{
    background: linear-gradient(135deg, var(--blue), var(--blue-deep));
    align-self: flex-end;
    border-radius: 18px 18px 4px 18px;
    color: white;
    box-shadow: 0 2px 10px rgba(22,59,118,0.22);
  }

  .msg.error{
    background: rgba(211,102,95,0.1);
    border: 1px solid rgba(211,102,95,0.3);
    color: #93312A;
  }

  .msg p{ margin: 0 0 8px; }
  .msg p:last-child{ margin-bottom: 0; }
  .msg strong{ color: var(--teal); }

  /* Chips de resposta rápida — só aparecem junto da primeira mensagem */
  .quick-replies{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 2px 0 4px 4px;
    max-width: 86%;
  }

  .quick-reply{
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: var(--panel-solid);
    color: var(--blue-deep);
    font-weight: 600;
    cursor:pointer;
    box-shadow: 0 2px 6px rgba(18,50,90,0.04);
    transition: all .15s ease;
  }
  .quick-reply:hover{
    background: var(--blue-bright);
    border-color: var(--blue-bright);
    color: white;
  }

  .quick-reply.other{
    background: transparent;
    color: var(--mist);
    border: 1px dashed var(--line);
    font-weight: 500;
  }
  .quick-reply.other:hover{
    background: var(--bg-soft);
    border-color: var(--mist-dim);
    color: var(--ink);
  }

  .typing{
    align-self: flex-start;
    display:flex;
    gap: 4px;
    padding: 13px 16px;
    background: var(--panel-solid);
    border-radius: 18px 18px 18px 4px;
    box-shadow: 0 2px 8px rgba(18,50,90,0.05);
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background: var(--mist);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay: .15s; }
  .typing span:nth-child(3){ animation-delay: .3s; }
  @keyframes bounce{
    0%, 60%, 100%{ transform: translateY(0); opacity:.5; }
    30%{ transform: translateY(-4px); opacity:1; }
  }

  /* ---------- Input fixo no rodapé, formato pill ---------- */
  .chat-input{
    flex-shrink: 0;
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--panel-solid);
    border-top: 1px solid var(--line-soft);
  }

  .chat-input input{
    flex:1;
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 12px 18px;
    font-family:'Manrope', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--bg-soft);
  }

  .chat-input input::placeholder{ color: var(--mist-dim); }
  .chat-input input:focus{ outline: none; border-color: var(--blue-bright); }

  .chat-input button{
    flex-shrink: 0;
    width: 44px; height: 44px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue-bright), var(--blue-deep));
    color: white;
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(47,99,199,0.35);
  }
  .chat-input button svg{ width: 18px; height: 18px; }
  .chat-input button:disabled{ opacity: .45; cursor: not-allowed; box-shadow:none; }
  .chat-input button:hover:not(:disabled){ filter: brightness(1.08); }
</style>
</head>

<script>
(function(){

  // ⚠️ Mesma config do projeto Firebase já usada no site em produção
  var firebaseConfig = {
    apiKey: "AIzaSyDe-6daNTnjBFJHwlQO-MKSZd_qOS14Xug",
    authDomain: "ia-modvida.firebaseapp.com",
    projectId: "ia-modvida",
    storageBucket: "ia-modvida.firebasestorage.app",
    messagingSenderId: "296074943295",
    appId: "1:296074943295:web:902a903e70d5d56efb518a"
  };

  firebase.initializeApp(firebaseConfig);
  var functions = firebase.app().functions("southamerica-east1");
  var chatWithAI = functions.httpsCallable("chatWithAI");

  var chatBody = document.getElementById('chatBody');
  var chatInput = document.getElementById('chatInput');
  var sendBtn = document.getElementById('sendBtn');
  var statusLabel = document.getElementById('statusLabel');
  var resetBtn = document.getElementById('resetBtn');

  var conversationHistory = [];
  var isWaitingReply = false;

  function scrollToBottom(){
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function escapeHTML(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderMarkdownLite(text){
    var escaped = escapeHTML(text);
    var withBold = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    var paragraphs = withBold.split(/\n{2,}/).map(function(p){
      return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
    });
    return paragraphs.join('');
  }

  function removeQuickReplies(){
    var groups = document.querySelectorAll('.quick-replies');
    groups.forEach(function(g){ g.remove(); });
  }

  function addUserMessage(text){
    var div = document.createElement('div');
    div.className = 'msg user';
    var p = document.createElement('p');
    p.textContent = text;
    div.appendChild(p);
    chatBody.appendChild(div);
    scrollToBottom();
  }

  function addBotMessageHTML(html, extraClass){
    var div = document.createElement('div');
    div.className = 'msg bot' + (extraClass ? ' ' + extraClass : '');
    div.innerHTML = html;
    chatBody.appendChild(div);
    scrollToBottom();
    return div;
  }

  function showTyping(){
    var div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    chatBody.appendChild(div);
    scrollToBottom();
  }

  function hideTyping(){
    var el = document.getElementById('typingIndicator');
    if(el){ el.remove(); }
  }

  function setWaiting(waiting){
    isWaitingReply = waiting;
    sendBtn.disabled = waiting;
    chatInput.disabled = waiting;
  }

  // ---------- Botões de comprimento/textura (a IA sinaliza no fim da mensagem) ----------
  var COMPRIMENTO_OPTIONS = [
    { label: 'Curto', msg: 'Meu cabelo é curto' },
    { label: 'Médio', msg: 'Meu cabelo é médio' },
    { label: 'Comprido', msg: 'Meu cabelo é comprido' }
  ];
  var TEXTURA_OPTIONS = [
    { label: 'Liso', msg: 'Meu cabelo é liso' },
    { label: 'Ondulado', msg: 'Meu cabelo é ondulado' },
    { label: 'Cacheado', msg: 'Meu cabelo é cacheado' },
    { label: 'Crespo', msg: 'Meu cabelo é crespo' }
  ];

  function extractQuickReplyMarker(text){
    var match = text.match(/\s*\[BOTOES_(COMPRIMENTO|TEXTURA)\]\s*$/);
    if(!match){ return { text: text, marker: null }; }
    return { text: text.slice(0, match.index).trim(), marker: match[1] };
  }

  function addDynamicQuickReplies(options){
    var wrap = document.createElement('div');
    wrap.className = 'quick-replies';
    options.forEach(function(opt){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'quick-reply';
      btn.textContent = opt.label;
      btn.addEventListener('click', function(){
        if(isWaitingReply){ return; }
        handleUserInput(opt.msg);
      });
      wrap.appendChild(btn);
    });
    chatBody.appendChild(wrap);
    scrollToBottom();
  }

  function handleBotReply(reply){
    var extracted = extractQuickReplyMarker(reply);
    conversationHistory.push({ role: 'assistant', content: extracted.text });
    addBotMessageHTML(renderMarkdownLite(extracted.text));
    if(extracted.marker === 'COMPRIMENTO'){
      addDynamicQuickReplies(COMPRIMENTO_OPTIONS);
    } else if(extracted.marker === 'TEXTURA'){
      addDynamicQuickReplies(TEXTURA_OPTIONS);
    }
  }

  function handleUserInput(text){
    text = text.trim();
    if(!text || isWaitingReply){ return; }

    removeQuickReplies();
    addUserMessage(text);
    conversationHistory.push({ role: 'user', content: text });
    chatInput.value = '';
    setWaiting(true);
    showTyping();

    chatWithAI({ messages: conversationHistory })
      .then(function(result){
        hideTyping();
        setWaiting(false);
        var reply = result.data && result.data.reply ? result.data.reply : '';
        handleBotReply(reply);
      })
      .catch(function(err){
        hideTyping();
        setWaiting(false);
        statusLabel.textContent = 'instável';
        statusLabel.classList.add('offline');
        addBotMessageHTML(
          '<p>Ops, não consegui falar com o servidor agora 😕 Pode tentar de novo em instantes?</p>',
          'error'
        );
        console.error('Erro ao chamar chatWithAI:', err);
      });
  }

  sendBtn.addEventListener('click', function(){
    handleUserInput(chatInput.value);
  });

  chatInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      handleUserInput(chatInput.value);
    }
  });

  function handleQuickReplyClick(){
    if(isWaitingReply){ return; }
    if(this.getAttribute('data-other')){
      removeQuickReplies();
      addBotMessageHTML('<p>Sem problemas! Me explica com suas palavras o que está acontecendo ou qual é a sua dúvida no momento 👇</p>');
      chatInput.focus();
      return;
    }
    handleUserInput(this.getAttribute('data-msg'));
  }

  var tags = document.querySelectorAll('.quick-reply');
  for(var i = 0; i < tags.length; i++){
    tags[i].addEventListener('click', handleQuickReplyClick);
  }

  resetBtn.addEventListener('click', function(){
    if(isWaitingReply){ return; }
    conversationHistory = [];
    chatBody.innerHTML =
      '<div class="msg bot">' +
        '<p><strong>Oi! Que bom te ver por aqui 💛</strong></p>' +
        '<p>Vou te ajudar a entender melhor o que pode estar acontecendo e indicar um produto Modvida que combina com o seu caso.</p>' +
        '<p>Pra começar, me conta: o que está acontecendo com o seu cabelo?</p>' +
      '</div>' +
      '<div class="quick-replies">' +
        '<button class="quick-reply" data-msg="Minha principal queixa é queda de cabelo">🍃 Queda de cabelo</button>' +
        '<button class="quick-reply" data-msg="Meu cabelo está danificado e quebradiço">🔗 Danificado / quebradiço</button>' +
        '<button class="quick-reply" data-msg="Meu cabelo loiro está amarelando">✨ Loiro amarelando</button>' +
        '<button class="quick-reply" data-msg="Meu cabelo está ressecado e sem brilho">💧 Ressecamento</button>' +
        '<button class="quick-reply other" data-other="1">💬 Outro problema</button>' +
      '</div>';
    var newTags = document.querySelectorAll('.quick-reply');
    for(var j = 0; j < newTags.length; j++){
      newTags[j].addEventListener('click', handleQuickReplyClick);
    }
    statusLabel.textContent = 'on-line';
    statusLabel.classList.remove('offline');
  });

})();
</script>

</body>
</html>
